<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Plan - NutriFit</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./My plan.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="./Home.html">Home</a></li>
            <li><a href="./Catalog.html">Meal Planner</a></li>
            <li><a href="./Catalog-fitness.html">Fitness Tracker</a></li>
        </ul>
    </nav>

    <h1 class="my-4">My Plan</h1>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h2>Meal Plan</h2>
                <div id="meal-list" class="list-group">
                    <!-- Meals will be loaded here -->
                </div>
            </div>
            <div class="col-md-6">
                <h2>Workout Plan</h2>
                <div id="workout-list" class="list-group">
                    <!-- Workouts will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 NutriFit</p>
    </footer>

    <script>
        function loadPlan() {
            const plan = JSON.parse(localStorage.getItem('nutriPlan')) || { meals: [], workouts: [] };
            const mealList = document.getElementById('meal-list');
            const workoutList = document.getElementById('workout-list');

            // Load meals
            if (plan.meals.length > 0) {
                mealList.innerHTML = plan.meals.map(meal => `
                    <div class="list-group-item">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">${meal.name}</h5>
                            <button class="btn btn-sm btn-danger" onclick="removeItem('meal', '${meal.name}')">Remove</button>
                        </div>
                        <img src="${meal.image}" class="img-thumbnail my-2" style="width: 100px; height: 100px; object-fit: cover;">
                        <p class="mb-1">${meal.description}</p>
                    </div>
                `).join('');
            } else {
                mealList.innerHTML = '<p class="text-muted">No meals in your plan yet.</p>';
            }

            // Load workouts
            if (plan.workouts.length > 0) {
                workoutList.innerHTML = plan.workouts.map(workout => `
                    <div class="list-group-item">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">${workout.name}</h5>
                            <button class="btn btn-sm btn-danger" onclick="removeItem('workout', '${workout.name}')">Remove</button>
                        </div>
                        <img src="${workout.image}" class="img-thumbnail my-2" style="width: 100px; height: 100px; object-fit: cover;">
                        <p class="mb-1">${workout.description}</p>
                    </div>
                `).join('');
            } else {
                workoutList.innerHTML = '<p class="text-muted">No workouts in your plan yet.</p>';
            }
        }

        function removeItem(type, name) {
            let plan = JSON.parse(localStorage.getItem('nutriPlan')) || { meals: [], workouts: [] };
            
            if (type === 'meal') {
                plan.meals = plan.meals.filter(meal => meal.name !== name);
            } else {
                plan.workouts = plan.workouts.filter(workout => workout.name !== name);
            }
            
            localStorage.setItem('nutriPlan', JSON.stringify(plan));
            loadPlan(); // Refresh the display
        }

        // Load the plan when the page loads
        window.addEventListener('DOMContentLoaded', loadPlan);
    </script>
</body>
</html>
